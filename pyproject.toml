[project]
name = "controllability-code"
version = "0.1.0"
description = "Numerical experiments for data-driven control in infinite-dimensional spaces"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.10.8",
    "numpy>=2.4.1",
    "scipy>=1.14.0",
]

[dependency-groups]
# Installed by `uv sync`, not by an install of the package itself.
dev = [
    "pytest>=8.0",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ddinf"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# F: undefined names and unused imports.  E/W: PEP 8.  I: import order.
# UP: constructs superseded by the minimum Python version.
select = ["F", "E", "W", "I", "UP"]
